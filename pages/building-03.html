<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>法源寺·北京</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../detail.css"></head><body><a class="home" href="../index.html" aria-label="返回首页"><svg viewBox="0 0 64 80" fill="none" aria-hidden="true"><path d="M32 0v22" stroke="currentColor" stroke-width="1"/><path d="M12 37c8 0 14-4 20-11 6 7 12 11 20 11M9 35l3 5h40l3-5M16 45h32M20 45v22m24-22v22M16 68h32M25 48v17m14-17v17M14 72h36" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a><button class="language-toggle" type="button" aria-label="Switch to English">EN</button><main class="detail"><div class="detail-picture" style="width:min(100%,222.0px)"><span class="cutout" style="aspect-ratio:916/1403"><img src="../assets/architecture-03.png" alt="法源寺" draggable="false" style="width:223.580786%;max-width:none;left:-53.275109%;top:-4.918033%"></span></div><h1 data-zh="法源寺·北京" data-en="Fayuan Temple · Beijing">法源寺·北京</h1><p class="description" data-zh="法源寺位于北京，是一座具有悠久历史的佛教寺院，其创建可追溯至唐代。寺院以殿宇与院落依次展开，建筑之间的门、廊和树木，使从城市街巷进入寺内的过程逐渐转向安静。屋顶的曲线、木构的节奏与石刻的细节，共同体现北方寺院建筑的秩序和工艺。图片选取的是石狮，它虽不是殿堂本身，却是理解寺院入口文化的重要线索：卷曲的鬃毛、饱满的体量与雕刻繁密的基座，使坚硬石材呈现出丰富层次。传统建筑往往由主体、附属构件与庭院环境共同构成。通过这样一件细部，也可以观察工匠如何将守护的寓意与装饰艺术融入日常可见的建筑空间。" data-en="Fayuan Temple in Beijing traces its history to the Tang dynasty. Its halls and courtyards create an ordered sequence, while gateways, trees and passages soften the transition from city streets to a quieter religious setting. The photograph focuses on a stone lion rather than a temple hall. Curled hair, a solid body and a richly carved pedestal reveal the expressive possibilities of stone carving. Such details belong to a broader architectural ensemble: entrances, sculpture and courtyards help establish the character of a place alongside its principal buildings. The lion invites close attention to craftsmanship and the symbolism of protection.">法源寺位于北京，是一座具有悠久历史的佛教寺院，其创建可追溯至唐代。寺院以殿宇与院落依次展开，建筑之间的门、廊和树木，使从城市街巷进入寺内的过程逐渐转向安静。屋顶的曲线、木构的节奏与石刻的细节，共同体现北方寺院建筑的秩序和工艺。图片选取的是石狮，它虽不是殿堂本身，却是理解寺院入口文化的重要线索：卷曲的鬃毛、饱满的体量与雕刻繁密的基座，使坚硬石材呈现出丰富层次。传统建筑往往由主体、附属构件与庭院环境共同构成。通过这样一件细部，也可以观察工匠如何将守护的寓意与装饰艺术融入日常可见的建筑空间。</p></main><script src="../detail.js"></script></body></html>
