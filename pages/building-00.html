<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>耶鲁大学·纽黑文</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../detail.css"></head><body><a class="home" href="../index.html" aria-label="返回首页"><svg viewBox="0 0 64 80" fill="none" aria-hidden="true"><path d="M32 0v22" stroke="currentColor" stroke-width="1"/><path d="M12 37c8 0 14-4 20-11 6 7 12 11 20 11M9 35l3 5h40l3-5M16 45h32M20 45v22m24-22v22M16 68h32M25 48v17m14-17v17M14 72h36" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a><button class="language-toggle" type="button" aria-label="Switch to English">EN</button><main class="detail"><div class="detail-picture" style="width:min(100%,493.3px)"><span class="cutout" style="aspect-ratio:1921/1324"><img src="../assets/architecture-00.png" alt="保罗玛丽学院 耶鲁大学" draggable="false" style="width:106.611140%;max-width:none;left:0.000000%;top:-8.761329%"></span></div><h1 data-zh="耶鲁大学·纽黑文" data-en="Yale University · New Haven">耶鲁大学·纽黑文</h1><p class="description" data-zh="耶鲁大学位于美国康涅狄格州纽黑文，校园以多种时代与风格的建筑共同构成独特的城市景观。哥特复兴式建筑是其中醒目的组成部分，石砌立面、尖拱入口、塔楼和细密雕刻，使校园带有欧洲传统学院的气质。建筑围合出的庭院，则把开放的城市街道转化为安静的学习与交流空间。图片中的入口以高耸的双塔强调中心，拱门连接内外，窗洞与石材肌理丰富了立面的层次。行走其间，可以感受到厚重外墙与亲切庭院之间的尺度变化。这里的建筑价值不仅在于单体造型，也在于门廊、通道与院落如何组织日常校园生活，让历史感与现代教育在同一片空间中相遇。" data-en="Yale University in New Haven brings together architecture from many periods. Its Gothic Revival buildings are especially distinctive, with stone façades, pointed arches, towers and carved details. Enclosed courtyards create quieter places for study and conversation within the city. In this photograph, twin towers frame a central entrance, while the archway connects the street with the spaces beyond. Windows and textured masonry give depth to the façade. Yale’s architectural character emerges not only from individual buildings, but also from the sequence of gateways, passages and courts that shapes everyday campus life.">耶鲁大学位于美国康涅狄格州纽黑文，校园以多种时代与风格的建筑共同构成独特的城市景观。哥特复兴式建筑是其中醒目的组成部分，石砌立面、尖拱入口、塔楼和细密雕刻，使校园带有欧洲传统学院的气质。建筑围合出的庭院，则把开放的城市街道转化为安静的学习与交流空间。图片中的入口以高耸的双塔强调中心，拱门连接内外，窗洞与石材肌理丰富了立面的层次。行走其间，可以感受到厚重外墙与亲切庭院之间的尺度变化。这里的建筑价值不仅在于单体造型，也在于门廊、通道与院落如何组织日常校园生活，让历史感与现代教育在同一片空间中相遇。</p></main><script src="../detail.js"></script></body></html>
