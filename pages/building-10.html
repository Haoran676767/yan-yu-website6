<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>托普卡帕宫·伊斯坦布尔</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../detail.css"></head><body><a class="home" href="../index.html" aria-label="返回首页"><svg viewBox="0 0 64 80" fill="none" aria-hidden="true"><path d="M32 0v22" stroke="currentColor" stroke-width="1"/><path d="M12 37c8 0 14-4 20-11 6 7 12 11 20 11M9 35l3 5h40l3-5M16 45h32M20 45v22m24-22v22M16 68h32M25 48v17m14-17v17M14 72h36" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a><button class="language-toggle" type="button" aria-label="Switch to English">EN</button><main class="detail"><div class="detail-picture" style="width:min(100%,621.7px)"><span class="cutout" style="aspect-ratio:2048/1120"><img src="../assets/architecture-10.png" alt="托普卡帕宫" draggable="false" style="width:100.000000%;max-width:none;left:0.000000%;top:-37.142857%"></span></div><h1 data-zh="托普卡帕宫·伊斯坦布尔" data-en="Topkapi Palace · Istanbul">托普卡帕宫·伊斯坦布尔</h1><p class="description" data-zh="托普卡帕宫位于伊斯坦布尔历史半岛，是奥斯曼帝国宫廷的重要所在。它由庭院、门楼、厅堂、园林与不同用途的建筑逐步组成，空间体验更像一系列相互连接的院落，而不是一座体量集中的宫殿。图片中的双塔门楼以厚实墙体和高耸塔尖强调入口，拱门则控制着内外空间的转换。穿过门楼后，开阔庭院与回廊带来尺度和明暗的变化，也体现宫廷活动的不同层级。宫内建筑在长期使用中不断增建，保存了多个时期的艺术与工艺。这里值得关注的不只是华丽装饰，更是门、墙、廊和庭院如何共同组织秩序，让行政、居住、礼仪与休憩空间在同一个建筑群中保持联系，又各有界限。" data-en="Topkapi Palace on Istanbul’s historic peninsula was an important center of the Ottoman court. Rather than a single compact palace, it consists of linked courtyards, gateways, halls, gardens and buildings with different functions. The twin-towered gateway in the photograph emphasizes the transition between spaces through substantial walls and a central arch. Beyond such entrances, courts and colonnades create changes in scale, light and access. Successive additions preserve several periods of artistic and architectural work. The palace is especially revealing for the way doors, walls and courtyards organize administrative, residential, ceremonial and recreational spaces within a larger whole.">托普卡帕宫位于伊斯坦布尔历史半岛，是奥斯曼帝国宫廷的重要所在。它由庭院、门楼、厅堂、园林与不同用途的建筑逐步组成，空间体验更像一系列相互连接的院落，而不是一座体量集中的宫殿。图片中的双塔门楼以厚实墙体和高耸塔尖强调入口，拱门则控制着内外空间的转换。穿过门楼后，开阔庭院与回廊带来尺度和明暗的变化，也体现宫廷活动的不同层级。宫内建筑在长期使用中不断增建，保存了多个时期的艺术与工艺。这里值得关注的不只是华丽装饰，更是门、墙、廊和庭院如何共同组织秩序，让行政、居住、礼仪与休憩空间在同一个建筑群中保持联系，又各有界限。</p></main><script src="../detail.js"></script></body></html>
