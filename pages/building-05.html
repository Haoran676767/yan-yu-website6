<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>兰亭·绍兴</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../detail.css"></head><body><a class="home" href="../index.html" aria-label="返回首页"><svg viewBox="0 0 64 80" fill="none" aria-hidden="true"><path d="M32 0v22" stroke="currentColor" stroke-width="1"/><path d="M12 37c8 0 14-4 20-11 6 7 12 11 20 11M9 35l3 5h40l3-5M16 45h32M20 45v22m24-22v22M16 68h32M25 48v17m14-17v17M14 72h36" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a><button class="language-toggle" type="button" aria-label="Switch to English">EN</button><main class="detail"><div class="detail-picture" style="width:min(100%,426.4px)"><span class="cutout" style="aspect-ratio:1135/905"><img src="../assets/architecture-05.png" alt="兰亭" draggable="false" style="width:120.264317%;max-width:none;left:-7.929515%;top:-65.524862%"></span></div><h1 data-zh="兰亭·绍兴" data-en="Lanting · Shaoxing">兰亭·绍兴</h1><p class="description" data-zh="兰亭位于绍兴兰渚山麓，是与王羲之和《兰亭集序》密切相关的文化名胜。东晋永和九年的雅集，使这里成为书法与文人文化的重要象征。今天的园林通过亭、池、碑刻与曲折小径，将历史记忆转化为可行走、可停留的空间。图片中的小亭以舒展的檐角和集中的屋顶轮廓形成视觉重点，柱间的开敞部分又使建筑与周围景色保持联系。亭的尺度亲近人的身体，既可遮蔽风雨，也适合观景与阅读碑文。与宏大的宫殿相比，兰亭更重视建筑和自然之间的呼应：水面映照屋檐，竹木围合路径，文字留存在石上。人在其中的行走，使园林景致与书法传统产生细腻而持续的对话。" data-en="Lanting, near Shaoxing, is associated with Wang Xizhi and the famous Preface to the Orchid Pavilion Gathering. The gathering of 353 made the place an enduring symbol of calligraphy and literary culture. Pavilions, pools, inscriptions and winding paths give that memory a spatial form. In this photograph, the pavilion’s spreading eaves create a distinctive outline, while openings between its supports connect it to the landscape. Its intimate scale encourages visitors to pause, look around and read inscriptions. Water, bamboo, trees and stone texts work with the architecture to create a setting where landscape and literary memory remain closely connected.">兰亭位于绍兴兰渚山麓，是与王羲之和《兰亭集序》密切相关的文化名胜。东晋永和九年的雅集，使这里成为书法与文人文化的重要象征。今天的园林通过亭、池、碑刻与曲折小径，将历史记忆转化为可行走、可停留的空间。图片中的小亭以舒展的檐角和集中的屋顶轮廓形成视觉重点，柱间的开敞部分又使建筑与周围景色保持联系。亭的尺度亲近人的身体，既可遮蔽风雨，也适合观景与阅读碑文。与宏大的宫殿相比，兰亭更重视建筑和自然之间的呼应：水面映照屋檐，竹木围合路径，文字留存在石上。人在其中的行走，使园林景致与书法传统产生细腻而持续的对话。</p></main><script src="../detail.js"></script></body></html>
