<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鲍氏宗祠·徽州</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../detail.css"></head><body><a class="home" href="../index.html" aria-label="返回首页"><svg viewBox="0 0 64 80" fill="none" aria-hidden="true"><path d="M32 0v22" stroke="currentColor" stroke-width="1"/><path d="M12 37c8 0 14-4 20-11 6 7 12 11 20 11M9 35l3 5h40l3-5M16 45h32M20 45v22m24-22v22M16 68h32M25 48v17m14-17v17M14 72h36" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a><button class="language-toggle" type="button" aria-label="Switch to English">EN</button><main class="detail"><div class="detail-picture" style="width:min(100%,595.1px)"><span class="cutout" style="aspect-ratio:2048/1170"><img src="../assets/architecture-08.png" alt="棠樾鲍氏宗祠" draggable="false" style="width:100.000000%;max-width:none;left:0.000000%;top:-22.222222%"></span></div><h1 data-zh="鲍氏宗祠·徽州" data-en="Bao Family Ancestral Hall · Huizhou">鲍氏宗祠·徽州</h1><p class="description" data-zh="鲍氏宗祠是理解徽州宗族文化与传统建筑的重要窗口。祠堂既用于祭祀祖先，也承载族人集会、礼仪与共同记忆，其空间往往通过门厅、天井和厅堂逐层展开。棠樾鲍氏宗族的祠堂与周边牌坊、村落共同构成具有历史意义的文化景观。观察徽州祠堂，可以关注木构梁架如何组织室内空间，天井如何引入光线，以及砖、木、石雕怎样将故事与伦理观念转化为装饰。建筑的庄重不只来自体量，也来自中轴秩序、明暗变化和构件尺度的配合。由入口向内行进，空间逐渐收束与展开，体现日常生活和礼仪活动之间的区别。祠堂因此不仅是一座房屋，也是一种把家族关系、地方工艺和历史记忆联系起来的空间。" data-en="The Bao family ancestral halls offer a way to understand lineage culture and traditional architecture in Huizhou. Such halls supported ancestor worship, gatherings and ceremonies, often through a sequence of entrance halls, light wells and principal rooms. At Tangyue, ancestral halls form part of a broader historic landscape of memorial archways and village buildings. Timber frames organize the interior, courtyards admit daylight, and carved brick, wood and stone express stories and values. Axial planning, changing light and carefully proportioned details establish a ceremonial atmosphere. These buildings connect family memory, local craftsmanship and the shared life of a community.">鲍氏宗祠是理解徽州宗族文化与传统建筑的重要窗口。祠堂既用于祭祀祖先，也承载族人集会、礼仪与共同记忆，其空间往往通过门厅、天井和厅堂逐层展开。棠樾鲍氏宗族的祠堂与周边牌坊、村落共同构成具有历史意义的文化景观。观察徽州祠堂，可以关注木构梁架如何组织室内空间，天井如何引入光线，以及砖、木、石雕怎样将故事与伦理观念转化为装饰。建筑的庄重不只来自体量，也来自中轴秩序、明暗变化和构件尺度的配合。由入口向内行进，空间逐渐收束与展开，体现日常生活和礼仪活动之间的区别。祠堂因此不仅是一座房屋，也是一种把家族关系、地方工艺和历史记忆联系起来的空间。</p></main><script src="../detail.js"></script></body></html>
