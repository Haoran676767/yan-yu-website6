<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>都江堰·成都</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../detail.css"></head><body><a class="home" href="../index.html" aria-label="返回首页"><svg viewBox="0 0 64 80" fill="none" aria-hidden="true"><path d="M32 0v22" stroke="currentColor" stroke-width="1"/><path d="M12 37c8 0 14-4 20-11 6 7 12 11 20 11M9 35l3 5h40l3-5M16 45h32M20 45v22m24-22v22M16 68h32M25 48v17m14-17v17M14 72h36" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a><button class="language-toggle" type="button" aria-label="Switch to English">EN</button><main class="detail"><div class="detail-picture" style="width:min(100%,548.1px)"><span class="cutout" style="aspect-ratio:1741/1080"><img src="../assets/architecture-02.png" alt="都江堰" draggable="false" style="width:117.633544%;max-width:none;left:-17.633544%;top:-12.870370%"></span></div><h1 data-zh="都江堰·成都" data-en="Dujiangyan · Chengdu">都江堰·成都</h1><p class="description" data-zh="都江堰位于成都平原西部，以顺应自然水势的水利工程闻名。鱼嘴、飞沙堰与宝瓶口共同承担分水、排沙和引水功能，使岷江水流与周围农田形成持续运作的联系。这里的建筑景观也与水密切相关，桥梁、堤岸、庙宇和街巷共同组织了人们接近河流的方式。图片所示为南桥入口一带，重叠的屋顶、上扬的檐角与丰富的彩绘，使交通空间兼具观景和停留的意义。看这处建筑，不妨同时观察它与河岸、行人和远山的关系。都江堰的独特之处，正在于工程并未脱离日常生活：治水的智慧延伸为城市空间，也让建筑成为连接自然条件、地方文化与公共活动的重要媒介。" data-en="Dujiangyan, west of the Chengdu Plain, is known for an irrigation system that works with the natural flow of the Min River. Its key structures divide water, remove sediment and guide irrigation. Bridges, embankments, temples and streets also shape how people encounter the river. This photograph shows the entrance area of Nanqiao, where layered roofs, upturned eaves and painted decoration turn a crossing into a place to pause and look around. The wider landscape connects practical water management with everyday urban life, showing how engineering and architecture can respond together to natural conditions.">都江堰位于成都平原西部，以顺应自然水势的水利工程闻名。鱼嘴、飞沙堰与宝瓶口共同承担分水、排沙和引水功能，使岷江水流与周围农田形成持续运作的联系。这里的建筑景观也与水密切相关，桥梁、堤岸、庙宇和街巷共同组织了人们接近河流的方式。图片所示为南桥入口一带，重叠的屋顶、上扬的檐角与丰富的彩绘，使交通空间兼具观景和停留的意义。看这处建筑，不妨同时观察它与河岸、行人和远山的关系。都江堰的独特之处，正在于工程并未脱离日常生活：治水的智慧延伸为城市空间，也让建筑成为连接自然条件、地方文化与公共活动的重要媒介。</p></main><script src="../detail.js"></script></body></html>
