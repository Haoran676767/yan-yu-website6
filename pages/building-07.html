<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>塔克西姆清真寺·伊斯坦布尔</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../detail.css"></head><body><a class="home" href="../index.html" aria-label="返回首页"><svg viewBox="0 0 64 80" fill="none" aria-hidden="true"><path d="M32 0v22" stroke="currentColor" stroke-width="1"/><path d="M12 37c8 0 14-4 20-11 6 7 12 11 20 11M9 35l3 5h40l3-5M16 45h32M20 45v22m24-22v22M16 68h32M25 48v17m14-17v17M14 72h36" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a><button class="language-toggle" type="button" aria-label="Switch to English">EN</button><main class="detail"><div class="detail-picture" style="width:min(100%,475.6px)"><span class="cutout" style="aspect-ratio:2048/1464"><img src="../assets/architecture-07.png" alt="塔克西姆清真寺" draggable="false" style="width:100.000000%;max-width:none;left:0.000000%;top:-4.918033%"></span></div><h1 data-zh="塔克西姆清真寺·伊斯坦布尔" data-en="Taksim Mosque · Istanbul">塔克西姆清真寺·伊斯坦布尔</h1><p class="description" data-zh="塔克西姆清真寺位于伊斯坦布尔塔克西姆广场一侧，于二〇二一年开放，是以当代方式延续传统宗教建筑语言的例子。中央穹顶统领整体体量，两侧细长的宣礼塔拉高建筑轮廓，周边较小的穹顶则使体量逐步过渡。立面以重复的窗洞、竖向构件和石材表面建立秩序，屋面与墙体的色彩差异进一步强调了穹顶形态。与历史悠久的清真寺相比，它面对的是更为繁忙的现代城市环境，因此建筑与广场、人流和公共活动之间的关系同样重要。观察这座建筑，可以看到传统形式并非只能作为历史遗存存在，也能够通过材料、比例与空间组织的重新处理，继续参与当代城市的日常生活。" data-en="Opened in 2021 beside Taksim Square in Istanbul, Taksim Mosque reinterprets traditional religious forms for a contemporary urban setting. A central dome anchors the composition, slender minarets extend its silhouette upward, and smaller domes mediate between the main volume and its edges. Repeated windows and vertical details organize the façades, while contrasting wall and roof materials clarify the building’s shape. Its relationship with the busy square is an important part of the design. The mosque demonstrates how inherited architectural forms can remain active in city life through new decisions about materials, proportions and spatial organization.">塔克西姆清真寺位于伊斯坦布尔塔克西姆广场一侧，于二〇二一年开放，是以当代方式延续传统宗教建筑语言的例子。中央穹顶统领整体体量，两侧细长的宣礼塔拉高建筑轮廓，周边较小的穹顶则使体量逐步过渡。立面以重复的窗洞、竖向构件和石材表面建立秩序，屋面与墙体的色彩差异进一步强调了穹顶形态。与历史悠久的清真寺相比，它面对的是更为繁忙的现代城市环境，因此建筑与广场、人流和公共活动之间的关系同样重要。观察这座建筑，可以看到传统形式并非只能作为历史遗存存在，也能够通过材料、比例与空间组织的重新处理，继续参与当代城市的日常生活。</p></main><script src="../detail.js"></script></body></html>
