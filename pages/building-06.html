<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>圣心天主教堂·萨拉热窝</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../detail.css"></head><body><a class="home" href="../index.html" aria-label="返回首页"><svg viewBox="0 0 64 80" fill="none" aria-hidden="true"><path d="M32 0v22" stroke="currentColor" stroke-width="1"/><path d="M12 37c8 0 14-4 20-11 6 7 12 11 20 11M9 35l3 5h40l3-5M16 45h32M20 45v22m24-22v22M16 68h32M25 48v17m14-17v17M14 72h36" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a><button class="language-toggle" type="button" aria-label="Switch to English">EN</button><main class="detail"><div class="detail-picture" style="width:min(100%,267.4px)"><span class="cutout" style="aspect-ratio:1384/1760"><img src="../assets/architecture-06.png" alt="圣心天主大教堂" draggable="false" style="width:110.910405%;max-width:none;left:-6.430636%;top:-0.227273%"></span></div><h1 data-zh="圣心天主教堂·萨拉热窝" data-en="Sacred Heart Cathedral · Sarajevo">圣心天主教堂·萨拉热窝</h1><p class="description" data-zh="圣心天主教堂位于萨拉热窝市中心，是这座城市具有辨识度的宗教建筑之一。教堂由建筑师约瑟普·万察什设计，于十九世纪末建成，整体采用哥特复兴风格。正立面的双塔形成对称构图，高耸的尖顶强调竖向趋势，中央的玫瑰窗则以放射状纹样成为视觉焦点。入口层层收进的拱券，让厚重墙体呈现出深度，也强化了进入内部空间的仪式感。浅色石材、深色窗洞和金属屋面形成清晰的材质对比。在街道尺度上，教堂与前方公共空间共同构成城市中的停留节点。它不仅展示了欧洲宗教建筑语言，也见证了萨拉热窝不同文化与建筑传统在同一座城市中相邻并存的历史。" data-en="Sacred Heart Cathedral is a recognizable landmark in central Sarajevo. Designed by Josip Vancaš and built in the late nineteenth century, it uses Gothic Revival forms. Twin towers organize the symmetrical façade, pointed spires draw the eye upward, and a central rose window introduces a radial pattern. Receding entrance arches give depth to the masonry and mark the transition into the church. Pale stone, dark window openings and metal roofs create clear material contrasts. The cathedral and the space in front of it also serve as a place to pause within the city, reflecting Sarajevo’s layered architectural and cultural history.">圣心天主教堂位于萨拉热窝市中心，是这座城市具有辨识度的宗教建筑之一。教堂由建筑师约瑟普·万察什设计，于十九世纪末建成，整体采用哥特复兴风格。正立面的双塔形成对称构图，高耸的尖顶强调竖向趋势，中央的玫瑰窗则以放射状纹样成为视觉焦点。入口层层收进的拱券，让厚重墙体呈现出深度，也强化了进入内部空间的仪式感。浅色石材、深色窗洞和金属屋面形成清晰的材质对比。在街道尺度上，教堂与前方公共空间共同构成城市中的停留节点。它不仅展示了欧洲宗教建筑语言，也见证了萨拉热窝不同文化与建筑传统在同一座城市中相邻并存的历史。</p></main><script src="../detail.js"></script></body></html>
