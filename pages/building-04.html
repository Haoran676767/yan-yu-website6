<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>寒山寺·苏州</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../detail.css"></head><body><a class="home" href="../index.html" aria-label="返回首页"><svg viewBox="0 0 64 80" fill="none" aria-hidden="true"><path d="M32 0v22" stroke="currentColor" stroke-width="1"/><path d="M12 37c8 0 14-4 20-11 6 7 12 11 20 11M9 35l3 5h40l3-5M16 45h32M20 45v22m24-22v22M16 68h32M25 48v17m14-17v17M14 72h36" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a><button class="language-toggle" type="button" aria-label="Switch to English">EN</button><main class="detail"><div class="detail-picture" style="width:min(100%,260.7px)"><span class="cutout" style="aspect-ratio:1364/1779"><img src="../assets/architecture-04.png" alt="寒山寺" draggable="false" style="width:100.000000%;max-width:none;left:0.000000%;top:-15.120854%"></span></div><h1 data-zh="寒山寺·苏州" data-en="Hanshan Temple · Suzhou">寒山寺·苏州</h1><p class="description" data-zh="寒山寺位于苏州枫桥一带，因唐代诗人张继的《枫桥夜泊》而广为人知。寺院与河道、桥梁和街巷相互联系，形成江南水乡中兼具宗教生活与文学记忆的场所。图片中的普明宝塔是寺内醒目的建筑，层层屋檐向外舒展，栏杆与柱列形成重复的节奏，顶部塔刹则强化了向上的轮廓。这座宝塔于二十世纪九十年代重建，体现传统建筑形式在当代的延续。与横向展开的殿堂相比，塔的竖向体量为寺院建立了视觉中心。走近时可以观看木构与屋瓦的细部，退远时则能感受塔影与屋顶组成的层次。寒山寺的魅力，也来自建筑、钟声、流水与诗歌共同构成的空间体验。" data-en="Hanshan Temple stands near Fengqiao in Suzhou and is closely associated with Zhang Ji’s poem about a night mooring there. Waterways, bridges and streets place the temple within a distinctive Jiangnan landscape. The photograph features Puming Pagoda, rebuilt in the 1990s. Projecting eaves, repeated columns and railings create a layered upward rhythm, capped by a finial. Its vertical form contrasts with the lower temple halls and gives the complex a visual focus. Close views reveal construction details; distant views bring together the tower and surrounding roofs. Architecture, bells, water and poetry all contribute to the identity of this place.">寒山寺位于苏州枫桥一带，因唐代诗人张继的《枫桥夜泊》而广为人知。寺院与河道、桥梁和街巷相互联系，形成江南水乡中兼具宗教生活与文学记忆的场所。图片中的普明宝塔是寺内醒目的建筑，层层屋檐向外舒展，栏杆与柱列形成重复的节奏，顶部塔刹则强化了向上的轮廓。这座宝塔于二十世纪九十年代重建，体现传统建筑形式在当代的延续。与横向展开的殿堂相比，塔的竖向体量为寺院建立了视觉中心。走近时可以观看木构与屋瓦的细部，退远时则能感受塔影与屋顶组成的层次。寒山寺的魅力，也来自建筑、钟声、流水与诗歌共同构成的空间体验。</p></main><script src="../detail.js"></script></body></html>
