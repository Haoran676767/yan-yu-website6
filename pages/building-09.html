<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>天坛·北京</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../detail.css"></head><body><a class="home" href="../index.html" aria-label="返回首页"><svg viewBox="0 0 64 80" fill="none" aria-hidden="true"><path d="M32 0v22" stroke="currentColor" stroke-width="1"/><path d="M12 37c8 0 14-4 20-11 6 7 12 11 20 11M9 35l3 5h40l3-5M16 45h32M20 45v22m24-22v22M16 68h32M25 48v17m14-17v17M14 72h36" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a><button class="language-toggle" type="button" aria-label="Switch to English">EN</button><main class="detail"><div class="detail-picture" style="width:min(100%,353.9px)"><span class="cutout" style="aspect-ratio:1450/1393"><img src="../assets/architecture-09.png" alt="天坛" draggable="false" style="width:141.241379%;max-width:none;left:-23.448276%;top:-5.958363%"></span></div><h1 data-zh="天坛·北京" data-en="Temple of Heaven · Beijing">天坛·北京</h1><p class="description" data-zh="天坛位于北京，是明清两代皇帝祭天祈谷的重要场所。建筑群以坛、殿、道路和大片林地共同构成庄严的礼仪空间，其中祈年殿是最具代表性的形象。图片中的祈年殿采用圆形平面，三层蓝色屋顶逐级收分，金色宝顶形成向上的视觉中心。环绕建筑的柱列和层叠屋檐，让体量在重复中呈现轻重与节奏的变化。蓝瓦与红柱的对比，也使建筑在开阔天空下格外鲜明。天坛的意义并不局限于单座殿宇，其总体布局、几何形态与行进路线都与传统的天人观念相联系。由广阔场地走向中心建筑，人会不断感受到尺度和秩序的变化，体会古代礼制如何通过空间成为可见、可感的经验。" data-en="The Temple of Heaven in Beijing was an imperial setting for sacrifices to heaven and prayers for good harvests during the Ming and Qing dynasties. Altars, halls, ceremonial routes and wooded grounds form a unified landscape. The photograph shows the Hall of Prayer for Good Harvests, whose circular plan and three diminishing blue roofs create its distinctive silhouette. Repeated columns and eaves give rhythm to the form, while the gilded finial marks its summit. The complex’s geometry and spatial sequence express traditional ideas about heaven and humanity. Open ground and focused ceremonial buildings make those ideas tangible through scale and movement.">天坛位于北京，是明清两代皇帝祭天祈谷的重要场所。建筑群以坛、殿、道路和大片林地共同构成庄严的礼仪空间，其中祈年殿是最具代表性的形象。图片中的祈年殿采用圆形平面，三层蓝色屋顶逐级收分，金色宝顶形成向上的视觉中心。环绕建筑的柱列和层叠屋檐，让体量在重复中呈现轻重与节奏的变化。蓝瓦与红柱的对比，也使建筑在开阔天空下格外鲜明。天坛的意义并不局限于单座殿宇，其总体布局、几何形态与行进路线都与传统的天人观念相联系。由广阔场地走向中心建筑，人会不断感受到尺度和秩序的变化，体会古代礼制如何通过空间成为可见、可感的经验。</p></main><script src="../detail.js"></script></body></html>
