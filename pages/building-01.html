<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>布达拉宫·拉萨</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../detail.css"></head><body><a class="home" href="../index.html" aria-label="返回首页"><svg viewBox="0 0 64 80" fill="none" aria-hidden="true"><path d="M32 0v22" stroke="currentColor" stroke-width="1"/><path d="M12 37c8 0 14-4 20-11 6 7 12 11 20 11M9 35l3 5h40l3-5M16 45h32M20 45v22m24-22v22M16 68h32M25 48v17m14-17v17M14 72h36" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a><button class="language-toggle" type="button" aria-label="Switch to English">EN</button><main class="detail"><div class="detail-picture" style="width:min(100%,498.2px)"><span class="cutout" style="aspect-ratio:2000/1365"><img src="../assets/architecture-01.png" alt="布达拉宫" draggable="false" style="width:102.400000%;max-width:none;left:-2.400000%;top:0.000000%"></span></div><h1 data-zh="布达拉宫·拉萨" data-en="Potala Palace · Lhasa">布达拉宫·拉萨</h1><p class="description" data-zh="布达拉宫坐落于拉萨红山之上，是西藏极具代表性的宫堡式建筑群，也是藏传佛教的重要文化地标。建筑顺应山势逐层展开，以白宫与红宫形成鲜明的色彩对比，高大的墙体、密集的窗洞和层叠的平台共同构成庄严的轮廓。宫殿、佛殿与院落并非孤立分布，而是通过楼梯和通道相互联系，让行进过程伴随高度与视野的变化。白色墙面与深色窗框突出厚重的体量，金色屋顶则点亮建筑上部的天际线。观察布达拉宫，既能感受山地建筑对地形的回应，也能理解宗教、政治与生活空间如何被整合在庞大的建筑体系之中，形成自然景观与人文历史相互交织的整体。" data-en="Rising above Lhasa on Red Hill, the Potala Palace is a major Tibetan palace complex and a landmark of Tibetan Buddhism. Its buildings follow the slope, with the White and Red Palaces creating a striking contrast. Massive walls, repeated windows and stepped terraces shape its silhouette. Stairs and passages connect halls, chapels and courtyards, making movement through the complex an experience of changing levels and views. Dark window surrounds emphasize the white walls, while gilded roofs catch the light above. The palace shows how architecture, mountain terrain and religious history can form a single monumental landscape.">布达拉宫坐落于拉萨红山之上，是西藏极具代表性的宫堡式建筑群，也是藏传佛教的重要文化地标。建筑顺应山势逐层展开，以白宫与红宫形成鲜明的色彩对比，高大的墙体、密集的窗洞和层叠的平台共同构成庄严的轮廓。宫殿、佛殿与院落并非孤立分布，而是通过楼梯和通道相互联系，让行进过程伴随高度与视野的变化。白色墙面与深色窗框突出厚重的体量，金色屋顶则点亮建筑上部的天际线。观察布达拉宫，既能感受山地建筑对地形的回应，也能理解宗教、政治与生活空间如何被整合在庞大的建筑体系之中，形成自然景观与人文历史相互交织的整体。</p></main><script src="../detail.js"></script></body></html>
