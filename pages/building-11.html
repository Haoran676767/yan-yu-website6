<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>伊奥拉尼宫·檀香山</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../detail.css"></head><body><a class="home" href="../index.html" aria-label="返回首页"><svg viewBox="0 0 64 80" fill="none" aria-hidden="true"><path d="M32 0v22" stroke="currentColor" stroke-width="1"/><path d="M12 37c8 0 14-4 20-11 6 7 12 11 20 11M9 35l3 5h40l3-5M16 45h32M20 45v22m24-22v22M16 68h32M25 48v17m14-17v17M14 72h36" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a><button class="language-toggle" type="button" aria-label="Switch to English">EN</button><main class="detail"><div class="detail-picture" style="width:min(100%,328.0px)"><span class="cutout" style="aspect-ratio:1482/1536"><img src="../assets/architecture-11.png" alt="伊奥拉尼宫" draggable="false" style="width:138.191633%;max-width:none;left:-18.825911%;top:0.000000%"></span></div><h1 data-zh="伊奥拉尼宫·檀香山" data-en="Iolani Palace · Honolulu">伊奥拉尼宫·檀香山</h1><p class="description" data-zh="伊奥拉尼宫位于夏威夷檀香山，是夏威夷王国最后几位君主使用的王宫，也是当地历史与文化认同的重要象征。现存宫殿于一八八二年落成，建筑将欧洲宫殿的装饰语言与适应夏威夷气候的外廊相结合。图片中连续的柱列、拱券和两层敞廊，使立面既有严整节奏，也保留了室内外之间的过渡空间。细密栏杆与雕饰强化了宫廷建筑的精致感，屋顶和塔楼则为长立面增添起伏。宫内的公共接待空间与私人居室反映了王室生活的不同层面。今天观看这座建筑，既可以欣赏材料与比例，也应看到它所承载的王国历史：跨文化交流塑造了宫殿的外观，而地方记忆赋予了它更深的意义。" data-en="Iolani Palace in Honolulu was the residence of Hawaii’s last reigning monarchs and remains an important symbol of Hawaiian history and identity. Completed in 1882, it combines European-derived architectural details with open verandas suited to its setting. Repeated columns, arches and two levels of lanais create a measured façade and a transition between indoors and outdoors. Decorative railings and carved details enrich the surfaces, while towers articulate the roofline. Public reception rooms and private suites reflect different aspects of royal life. The building records both international exchange and the particular history of the Hawaiian Kingdom.">伊奥拉尼宫位于夏威夷檀香山，是夏威夷王国最后几位君主使用的王宫，也是当地历史与文化认同的重要象征。现存宫殿于一八八二年落成，建筑将欧洲宫殿的装饰语言与适应夏威夷气候的外廊相结合。图片中连续的柱列、拱券和两层敞廊，使立面既有严整节奏，也保留了室内外之间的过渡空间。细密栏杆与雕饰强化了宫廷建筑的精致感，屋顶和塔楼则为长立面增添起伏。宫内的公共接待空间与私人居室反映了王室生活的不同层面。今天观看这座建筑，既可以欣赏材料与比例，也应看到它所承载的王国历史：跨文化交流塑造了宫殿的外观，而地方记忆赋予了它更深的意义。</p></main><script src="../detail.js"></script></body></html>
