<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>兰亭·绍兴</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../detail.css"></head><body><a class="home" href="../index.html" aria-label="返回首页"><svg viewBox="0 0 64 80" fill="none" aria-hidden="true"><path d="M32 0v22" stroke="currentColor" stroke-width="1"/><path d="M12 37c8 0 14-4 20-11 6 7 12 11 20 11M9 35l3 5h40l3-5M16 45h32M20 45v22m24-22v22M16 68h32M25 48v17m14-17v17M14 72h36" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a><button class="language-toggle" type="button" aria-label="Switch to English">EN</button><main class="detail"><div class="detail-picture" style="width:min(100%,780.0px)"><span class="cutout" style="aspect-ratio:2011/576"><img src="../assets/architecture-14.png" alt="兰亭大殿" draggable="false" style="width:101.839881%;max-width:none;left:-0.696171%;top:-68.923611%"></span></div><h1 data-zh="兰亭·绍兴" data-en="Lanting · Shaoxing">兰亭·绍兴</h1><p class="description" data-zh="兰亭位于绍兴兰渚山麓，其文化意义与王羲之及《兰亭集序》紧密相连。东晋文人的雅集，使这里成为书法传统与山水审美的重要象征。图片中的殿堂以横向展开的屋顶和中部抬高的体量组织正面形象，左右对称的布局带来稳定而舒展的感受。灰色瓦面与深色木构形成清晰对比，檐下柱列、门窗和栏杆则建立细密的节奏。宽阔屋檐在建筑前形成阴影，让室内与室外之间有了柔和的过渡。观看这座殿堂，可以从屋脊、瓦片、立柱和门窗的关系入手，理解传统建筑如何兼顾支撑、围护与观赏。兰亭的魅力还来自建筑与周围自然环境的配合，使书法文化不只存在于文字中，也融入人的行走与停留。" data-en="Lanting near Shaoxing is closely associated with Wang Xizhi and the Preface to the Orchid Pavilion Gathering. Its literary history connects calligraphy with an appreciation of landscape. The hall in this photograph has a broad horizontal composition and a raised central roof. Symmetry gives the façade a calm balance, while gray tiles contrast with dark timber. Columns, windows and railings create a finer rhythm beneath the eaves. Deep roof projections form a shaded threshold between inside and outside. Looking at these elements together reveals how traditional architecture combines structural support, enclosure and visual expression within a wider cultural landscape.">兰亭位于绍兴兰渚山麓，其文化意义与王羲之及《兰亭集序》紧密相连。东晋文人的雅集，使这里成为书法传统与山水审美的重要象征。图片中的殿堂以横向展开的屋顶和中部抬高的体量组织正面形象，左右对称的布局带来稳定而舒展的感受。灰色瓦面与深色木构形成清晰对比，檐下柱列、门窗和栏杆则建立细密的节奏。宽阔屋檐在建筑前形成阴影，让室内与室外之间有了柔和的过渡。观看这座殿堂，可以从屋脊、瓦片、立柱和门窗的关系入手，理解传统建筑如何兼顾支撑、围护与观赏。兰亭的魅力还来自建筑与周围自然环境的配合，使书法文化不只存在于文字中，也融入人的行走与停留。</p></main><script src="../detail.js"></script></body></html>
