<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>哲蚌寺·拉萨</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../detail.css"></head><body><a class="home" href="../index.html" aria-label="返回首页"><svg viewBox="0 0 64 80" fill="none" aria-hidden="true"><path d="M32 0v22" stroke="currentColor" stroke-width="1"/><path d="M12 37c8 0 14-4 20-11 6 7 12 11 20 11M9 35l3 5h40l3-5M16 45h32M20 45v22m24-22v22M16 68h32M25 48v17m14-17v17M14 72h36" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a><button class="language-toggle" type="button" aria-label="Switch to English">EN</button><main class="detail"><div class="detail-picture" style="width:min(100%,535.2px)"><span class="cutout" style="aspect-ratio:1985/1261"><img src="../assets/architecture-13.png" alt="哲蚌寺1" draggable="false" style="width:103.173804%;max-width:none;left:-3.173804%;top:-7.930214%"></span></div><h1 data-zh="哲蚌寺·拉萨" data-en="Drepung Monastery · Lhasa">哲蚌寺·拉萨</h1><p class="description" data-zh="哲蚌寺位于拉萨西郊山坡上，始建于十五世纪，是藏传佛教格鲁派的重要寺院之一。建筑群依地势层层展开，殿堂、经院、僧舍与道路共同构成近似山城的空间。白色墙体、深色窗框、红色构件和金色屋顶相互映衬，使朴素的体量与丰富的装饰并置。与平地上强调规整轴线的建筑群不同，山坡、台阶与转折路径参与了寺院的组织，行走时常会遇到新的院落与视角。图片中的墙面、门窗和檐下彩绘，可以帮助我们从局部理解藏式建筑的材料、色彩与尺度。哲蚌寺不仅是宗教活动的场所，也长期承担学习与传承的功能，其建筑因此同时回应集体仪式、日常居住和知识交流的需要。" data-en="Drepung Monastery stands on a hillside west of Lhasa. Founded in the fifteenth century, it became an important center of the Gelug tradition of Tibetan Buddhism. Halls, colleges, residences and paths spread across the slope like a small hillside town. White walls, dark window surrounds, red timber details and gilded roofs combine strong masses with intricate decoration. Steps and turning routes reveal changing courtyards and views rather than a single rigid axis. The photographed walls, windows and painted details offer a close view of Tibetan architectural color and scale. The complex accommodates religious ceremony, everyday living and traditions of learning.">哲蚌寺位于拉萨西郊山坡上，始建于十五世纪，是藏传佛教格鲁派的重要寺院之一。建筑群依地势层层展开，殿堂、经院、僧舍与道路共同构成近似山城的空间。白色墙体、深色窗框、红色构件和金色屋顶相互映衬，使朴素的体量与丰富的装饰并置。与平地上强调规整轴线的建筑群不同，山坡、台阶与转折路径参与了寺院的组织，行走时常会遇到新的院落与视角。图片中的墙面、门窗和檐下彩绘，可以帮助我们从局部理解藏式建筑的材料、色彩与尺度。哲蚌寺不仅是宗教活动的场所，也长期承担学习与传承的功能，其建筑因此同时回应集体仪式、日常居住和知识交流的需要。</p></main><script src="../detail.js"></script></body></html>
